general:
  num_snapshots: 100
  imt_link: DOWNLINK
  system: SINGLE_SPACE_STATION
  enable_cochannel: true
  enable_adjacent_channel: false
  seed: 285
  overwrite_output: false
  output_dir: campaigns/Guarulhos_database/output_dl/
  output_dir_prefix: database_sim_approach_20000m
database:
    ###########################################################################
    # Path to the database file
  database_file_name: 'sharc/campaigns/Guarulhos_database/Database_Anatel_claro s.a..csv'
    ###########################################################################
    # Database delimiter (for .csv files)
  delimiter: '\t'
    # Maximum rows to read. If -1, will load all rows
  max_rows: 1000
imt:
  minimum_separation_distance_bs_ue: 35
  interfered_with: false
  frequency: 3650
  bandwidth: 100
  rb_bandwidth: 0.18
  spectral_mask: 3GPP E-UTRA
  spurious_emissions: -30
  adjacent_ch_emissions: SPECTRAL_MASK
  adjacent_antenna_model: SINGLE_ELEMENT
  guard_band_ratio: 0.1
  topology:
    type: "GEN_MACROCELL"
    gen_macrocell:
      ###########################################################################
      # Cell radius.
      cell_radius: 400
      # Reference coordinates are used to filter the coordinates in the 
      # database. If the coordinates are within a distance of ref_dist [m], 
      # they are considered in the simulation. Otherwise, they are filtered out.
      # Reference latitude coordinate
      ref_lat: -23.6041
      # Reference longitude coordinate  
      ref_lon: -46.5919
  bs:
    load_probability: 0.5
    conducted_power: 28
    height: 20
    noise_figure: 5
    ohmic_loss: 0  #1.8 of table 9 and Note 1
    antenna:
      array:
        normalization: false
        element_pattern: M2101
        minimum_array_gain: -200
        horizontal_beamsteering_range: !!python/tuple
          - -60.0
          - 60.0
        vertical_beamsteering_range: !!python/tuple
          - 90.0
          - 100.0
        downtilt: 6
        element_max_g: 6.4
        element_phi_3db: 90
        element_theta_3db: 65
        n_rows: 4  ## Alterar para 8
        n_columns: 8
        element_horiz_spacing: 0.5
        element_vert_spacing: 2.1
        element_am: 30 ##Verificar se é o item 1.4 da tabela 9
        element_sla_v: 30 ##Verificar se é o item 1.4 da tabela 9
        multiplication_factor: 12 ## Procurar!
        subarray:
          is_enabled: true
          n_rows: 3
          element_vert_spacing: 0.7
          eletrical_downtilt: 3.0
  ue:
    k: 3
    k_m: 1
    indoor_percent: 70
    distribution_type: ANGLE_AND_DISTANCE
    distribution_distance: SQRT(UNIFORM)
    distribution_azimuth: UNIFORM
    tx_power_control: true
    p_o_pusch: -92.2
    alpha: 0.8
    p_cmax: 23
    power_dynamic_range: 56 ## Verificar
    height: 1.5
    noise_figure: 9
    ohmic_loss: 0
    body_loss: 4 ## Variar
    antenna:
      array:
        element_pattern: FIXED
        element_max_g: -4
        n_rows: 1
        n_columns: 1
  uplink:
    attenuation_factor: 0.4
    sinr_min: -10
    sinr_max: 22
  downlink:
    attenuation_factor: 0.6
    sinr_min: -10
    sinr_max: 30
  channel_model: UMa
  shadowing: true
single_space_station:
  frequency: 3650
  bandwidth: 300
  tx_power_density: -200
  polarization_loss: 3
  noise_temperature: 2900
  channel_model: P528
  param_p528:
    time_percentage: RANDOM
    polarization: 1
  geometry:
    altitude: 1048.16
    es_altitude: 0
    es_lat_deg: -23.6041
    es_long_deg: -46.5919
    azimuth:
      type: RANDOM_RANGE
      min: 0
      max: 360
    elevation:
      type: RANDOM_RANGE
      min: -90
      max: -70
    location:
      type: FIXED
      fixed:
        lat_deg: -23.496984
        long_deg: -46.665306
  antenna:
    pattern: RA_M2319
    gain: 0
    itu_ra_m2319:
      gain_isotropic_dbi: 0
      phi_3db_deg: 90
      inband: false
